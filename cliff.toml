# git-cliff configuration for pi-toolbelt
# https://git-cliff.org/docs/configuration
#
# Public changelog includes feat, fix, and all breaking changes.
# Routine internal categories are skipped unless the commit is breaking.
# CHANGELOG.md is generated exclusively by git-cliff; do not edit it by hand.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits -%}
        - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | trim }}
        {%- if commit.breaking_description %}{{ "\n" }}  - {{ commit.breaking_description | trim }}{% endif %}
    {% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^chore|^ci|^docs?|^refactor|^style|^test|^build|^perf|^revert", skip = true },
  { message = ".*", skip = true },
]
# Breaking commits (subject `!` or `BREAKING CHANGE:` footer) stay even when parsers skip them.
protect_breaking_commits = true
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
